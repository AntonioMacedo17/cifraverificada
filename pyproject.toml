[project]
name = "cifraverificada"
version = "0.1.0"
description = "Verificador de cifras del debate público peruano con datos oficiales del BCRP y del INEI."
requires-python = ">=3.11"
dependencies = [
    "streamlit",
    "pandas",
    "plotly",
    "httpx",
    "google-genai>=2.29.0",
    "pydantic",
    "python-dotenv",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
